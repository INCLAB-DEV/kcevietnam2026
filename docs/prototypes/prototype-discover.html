<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NABI - 기업 탐색 프로토타입 (DV-001, THROWAWAY)</title>
<link rel="stylesheet" href="nabi-ui.css?v=20260607"><!-- 단일 소스 토큰+크롬 -->
<!-- PROTOTYPE: DV-001 AI 추천 카드 — 디자인 변주 A/B/C (인터랙션은 C 스와이프+버튼 고정) -->
<!-- A: Quiet Paper(적합도 우상단 숫자) · B: Precision(가로 매치 바) · C: Bold Stat(상단 스탯 밴드) -->
<!-- 모든 플로우(상세 DV-002·미팅 MT-001·전체기업/관심기업 탭·Desktop)는 원본 그대로 유지 -->
<style>
  /* 토큰·리셋·크롬은 nabi-ui.css(단일 소스)에서 상속 */
  body { background: var(--bg-primary); }

  /* ── 단일 셸 반응형 (nabi-ui.css .app-shell/.app-content 상속) ──
     discover 는 #discover-root(=.app-content) 하나에만 렌더한다.
     좁음(폰/프리뷰) = 스와이프 덱, 넓음(데스크톱) = 추천 카드 그리드. */

  /* 좁음(< 720cqi): 기존 모바일 풀하이트 스와이프 경험 유지 */
  @container shell (max-width: 719px) {
    #discover-root { padding: 0; max-width: none; height: 100%; display: flex; flex-direction: column; min-height: 0; }
    .discover-page { height: 100%; flex: 1 1 0; min-height: 0; }
    .swipe-only { display: flex; }              /* 좁음: 스와이프 덱 노출 */
    .rec-grid   { display: none; }              /* 좁음: 그리드 숨김 */
  }

  /* 덱/그리드 display 는 base 에 두지 않는다 — base vs @container 충돌 회피.
     narrow(max 719)+wide(min 720)가 전 구간을 분할하므로 display는 두 쿼리에서만 정의. */
  .swipe-only { flex-direction: column; flex: 1 1 0; min-height: 0; }

  /* 데스크톱 추천 그리드 — 동일 카드 디자인(buildCardContent) 재사용 */
  .rec-grid { grid-template-columns: 1fr; gap: 16px; padding: 16px 0 56px; }
  .rec-card {
    background: var(--bg-elevated); border: 1px solid var(--border-default);
    border-radius: var(--radius-xl); box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    overflow: hidden; display: flex; flex-direction: column;
  }
  .rec-card .card-body { overflow: visible; }

  /* 넓음(≥ 720cqi): 자연 높이로 흐르고 그리드가 가로폭을 채움 */
  @container shell (min-width: 720px) {
    .discover-page { height: auto; overflow: visible; }
    .discover-header { padding: 4px 0 0; background: none; border-bottom: 0; }
    .discover-header .discover-tabs { border-bottom: 1px solid var(--border-default); }
    .tab-content { overflow: visible; }
    .tab-content.active { display: block; }
    .company-list { padding: 16px 0 56px; }
    .detail-body, .detail-actions, .detail-header { max-width: 760px; margin-inline: auto; width: 100%; }
    .meeting-overlay { align-items: center; }
    .meeting-sheet { max-width: 480px; max-height: 85%; border-radius: var(--radius-xl); }
    .swipe-only { display: none; }              /* 넓음: 스와이프 덱 숨김 */
    .rec-grid   { display: grid; grid-template-columns: repeat(2, 1fr); }
  }
  @container shell (min-width: 1040px) { .rec-grid { grid-template-columns: repeat(3, 1fr); } }

  /* ========== DISCOVER PAGE ========== */
  .discover-page {
    display: flex; flex-direction: column; height: 100%;
    overflow: hidden; background: var(--bg-primary);
  }
  .discover-header {
    padding: 16px 20px 0; background: var(--bg-elevated);
    border-bottom: 1px solid var(--border-default); flex-shrink: 0;
  }
  .discover-title {
    font-size: 20px; font-weight: 800; margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .discover-tabs { display: flex; }
  .discover-tab {
    flex: 1; padding: 12px 0; text-align: center; font-size: 14px; font-weight: 600;
    color: var(--text-tertiary); cursor: pointer; border: none; background: none;
    font-family: var(--font-stack); border-bottom: 2px solid transparent; transition: all 0.2s;
  }
  .discover-tab:hover { color: var(--text-secondary); }
  .discover-tab.active { color: var(--accent-primary); border-bottom-color: var(--accent-primary); }
  .tab-badge {
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--accent-primary); color: white;
    font-size: 11px; font-weight: 700; min-width: 18px; height: 18px;
    border-radius: 9px; padding: 0 5px; margin-left: 4px;
  }

  .tab-content { display: none; flex: 1; overflow: hidden; flex-direction: column; }
  .tab-content.active { display: flex; }

  /* ========== SWIPE CARD (Variant A/C) ========== */
  .card-stack-area {
    flex: 1; display: flex; align-items: center; justify-content: center;
    position: relative; padding: 12px 16px; overflow: hidden; min-height: 0;
  }
  .swipe-card {
    position: absolute; width: calc(100% - 32px);
    background: var(--bg-elevated); border-radius: var(--radius-xl);
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    cursor: grab; user-select: none; touch-action: none;
    will-change: transform; display: flex; flex-direction: column;
    max-height: calc(100% - 16px); overflow: hidden;
  }
  .swipe-card:active { cursor: grabbing; }
  .swipe-card.behind { transform: scale(0.97) translateY(8px); opacity: 0.7; pointer-events: none; }
  .swipe-card.far-behind { transform: scale(0.94) translateY(16px); opacity: 0.5; pointer-events: none; }

  .swipe-overlay {
    position: absolute; top: 16px; padding: 8px 16px;
    border-radius: var(--radius-full); font-size: 14px; font-weight: 800;
    opacity: 0; z-index: 10; pointer-events: none;
  }
  .swipe-overlay.left {
    right: 16px; background: var(--accent-red-subtle);
    color: var(--accent-red); border: 2px solid var(--accent-red);
  }
  .swipe-overlay.right {
    left: 16px; background: var(--accent-green-subtle);
    color: var(--accent-green); border: 2px solid var(--accent-green);
  }

  /* Card inner — clear hierarchy: name → reason → detail */
  .card-header {
    padding: 20px 20px 0; flex-shrink: 0;
  }
  .card-meta {
    display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
    font-size: 12px; color: var(--text-tertiary); font-weight: 600;
  }
  .card-match-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent-primary);
  }
  .card-company-name { font-size: 20px; font-weight: 800; line-height: 1.3; margin-bottom: 10px; }

  /* AI reason — second in hierarchy, clear and readable */
  .card-reason-hero {
    margin: 0 20px 14px; padding: 0;
  }
  .card-reason-text {
    font-size: 15px; color: var(--text-secondary); line-height: 1.65;
  }

  /* Card body — supporting info, visually lighter */
  .card-body { flex: 1; overflow-y: auto; padding: 0 20px; min-height: 0; }
  .card-keywords { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
  .card-keyword {
    padding: 4px 10px; background: var(--bg-secondary); color: var(--text-tertiary);
    border-radius: var(--radius-full); font-size: 11px; font-weight: 600;
  }
  .card-strength {
    font-size: 13px; color: var(--text-tertiary); line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  /* Bookmark row */
  .card-bookmark-row {
    display: flex; align-items: center; gap: 8px; padding: 0 20px 6px;
    flex-shrink: 0;
  }
  .card-bookmark-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: var(--radius-full);
    border: 1.5px solid var(--border-default); background: var(--bg-elevated);
    font-size: 13px; font-weight: 600; cursor: pointer;
    color: var(--text-tertiary); transition: all 0.15s;
    font-family: var(--font-stack);
  }
  .card-bookmark-btn:hover { border-color: var(--accent-green); color: var(--accent-green); }
  .card-bookmark-btn.saved {
    background: var(--accent-green-subtle); border-color: var(--accent-green);
    color: var(--accent-green);
  }

  /* Card actions */
  .card-actions {
    display: flex; gap: 8px; padding: 10px 20px 16px;
    flex-shrink: 0; border-top: 1px solid var(--border-default);
  }
  .card-action-btn {
    flex: 1; padding: 13px 8px; border-radius: var(--radius-md);
    font-size: 14px; font-weight: 700; cursor: pointer;
    font-family: var(--font-stack); border: none; transition: all 0.15s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .card-action-btn:hover { opacity: 0.85; }
  .card-action-btn.meeting {
    background: var(--accent-primary); color: white; flex: 1.5;
  }
  .card-action-btn.detail {
    background: var(--bg-secondary); color: var(--text-secondary);
  }

  /* Swipe hint */
  .swipe-hint {
    text-align: center; padding: 4px 20px 12px; font-size: 12px;
    color: var(--text-tertiary); flex-shrink: 0;
  }
  .hint-row { display: flex; justify-content: center; align-items: center; gap: 6px; }
  .hint-icon-sm {
    width: 20px; height: 20px; border-radius: 50%; font-size: 10px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .hint-icon-sm.pass { background: var(--accent-red-subtle); color: var(--accent-red); }

  /* Pass button (Variant C) */
  .pass-btn-bottom {
    display: flex; justify-content: center; gap: 10px; padding: 4px 20px 4px; flex-shrink: 0;
  }
  .pass-btn-circle {
    padding: 10px 20px; border-radius: var(--radius-full);
    background: var(--accent-red-subtle); color: var(--accent-red);
    border: 1.5px solid #fecaca; font-size: 14px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; font-family: var(--font-stack);
  }
  .pass-btn-circle:hover { transform: scale(1.05); }

  /* Card bottom row */
  .card-bottom-row {
    display: flex; align-items: center; justify-content: center;
    padding: 6px 20px; flex-shrink: 0; gap: 12px;
  }
  .card-counter {
    font-size: 12px; color: var(--text-tertiary); font-weight: 600;
  }
  .card-bookmark-btn-outer {
    padding: 7px 14px; border-radius: var(--radius-full);
    border: 1.5px solid var(--border-default); background: var(--bg-elevated);
    font-size: 13px; font-weight: 600; cursor: pointer;
    color: var(--text-tertiary); font-family: var(--font-stack);
    transition: all 0.15s;
  }
  .card-bookmark-btn-outer:hover { border-color: var(--accent-green); color: var(--accent-green); }
  .card-bookmark-btn-outer.saved {
    background: var(--accent-green-subtle); border-color: var(--accent-green);
    color: var(--accent-green);
  }

  /* ========== SCROLL CARD (Variant B) ========== */
  .scroll-card-area {
    flex: 1; overflow-y: auto; padding: 16px 20px 80px; display: flex;
    flex-direction: column; gap: 16px; scroll-snap-type: y proximity;
  }
  .scroll-card {
    background: var(--bg-elevated); border-radius: var(--radius-xl);
    box-shadow: 0 2px 12px rgba(0,0,0,0.06); overflow: hidden;
    scroll-snap-align: start; flex-shrink: 0;
  }
  .scroll-card .card-header { padding: 20px 20px 0; }
  .scroll-card .card-reason-hero { margin: 0 20px 14px; }
  .scroll-card .card-body { padding: 0 20px; overflow: visible; }
  .scroll-card .card-bookmark-row { padding: 0 20px 8px; }
  .scroll-card .card-actions { padding: 12px 20px 16px; }
  .scroll-card.passed {
    opacity: 0; max-height: 0; padding: 0; margin: 0; overflow: hidden;
    transition: all 0.3s ease;
  }

  /* ========== COMPLETE SCREEN ========== */
  .swipe-complete {
    display: none; flex-direction: column; align-items: center;
    justify-content: center; padding: 40px 32px; text-align: center; flex: 1;
  }
  .swipe-complete.active { display: flex; }
  .complete-icon { font-size: 56px; margin-bottom: 20px; width: 64px; height: 64px; border-radius: 50%; background: var(--accent-subtle); display: flex; align-items: center; justify-content: center; }
  .complete-title { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
  .complete-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 24px; }
  .complete-stats { display: flex; gap: 24px; margin-bottom: 28px; }
  .complete-stat-num { font-size: 28px; font-weight: 800; color: var(--accent-primary); }
  .complete-stat-label { font-size: 12px; color: var(--text-tertiary); font-weight: 600; }
  .complete-cta {
    padding: 14px 28px; background: var(--accent-primary); color: white;
    border: none; border-radius: var(--radius-full); font-size: 15px;
    font-weight: 700; cursor: pointer; font-family: var(--font-stack);
  }

  /* ========== ALL COMPANIES TAB ========== */
  .search-bar { padding: 16px 20px 12px; flex-shrink: 0; }
  .search-input-wrap {
    display: flex; align-items: center; background: var(--bg-secondary);
    border-radius: var(--radius-full); padding: 10px 16px; gap: 8px;
  }
  .search-input-wrap input {
    flex: 1; border: none; background: none; font-size: 14px;
    font-family: var(--font-stack); outline: none; color: var(--text-primary);
  }
  .filter-chips {
    display: flex; gap: 8px; padding: 0 20px 12px; overflow-x: auto; flex-shrink: 0;
  }
  .filter-chip {
    padding: 7px 14px; border-radius: var(--radius-full);
    border: 1.5px solid var(--border-default); background: var(--bg-elevated);
    font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: var(--font-stack); color: var(--text-secondary); white-space: nowrap;
  }
  .filter-chip:hover { border-color: var(--accent-primary); }
  .filter-chip.active { background: var(--accent-subtle); border-color: var(--accent-primary); color: var(--accent-primary); }
  .company-list { flex: 1; overflow-y: auto; padding: 0 20px 20px; }
  .company-item {
    display: flex; gap: 14px; padding: 16px; background: var(--bg-elevated);
    border-radius: var(--radius-lg); margin-bottom: 10px; cursor: pointer;
    transition: all 0.15s; border: 1px solid transparent;
  }
  .company-item:hover { border-color: var(--border-default); }
  .company-item-logo {
    width: 48px; height: 48px; background: var(--bg-secondary); border-radius: var(--radius-md);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 800; color: var(--text-tertiary); flex-shrink: 0;
  }
  .company-item-info { flex: 1; min-width: 0; }
  .company-item-name { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
  .company-item-desc { font-size: 12px; color: var(--text-tertiary); margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .company-item-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .company-item-tag { padding: 3px 8px; background: var(--bg-secondary); border-radius: var(--radius-full); font-size: 11px; font-weight: 600; color: var(--text-tertiary); }
  .company-item-bookmark { display: flex; align-items: flex-start; padding-top: 4px; font-size: 18px; color: var(--border-default); cursor: pointer; flex-shrink: 0; }
  .company-item-bookmark.saved { color: var(--accent-green); }

  /* ========== BOOKMARKS TAB ========== */
  .bookmarks-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; text-align: center; }
  .bookmarks-empty-icon { font-size: 48px; margin-bottom: 16px; }
  .bookmarks-empty-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
  .bookmarks-empty-desc { font-size: 13px; color: var(--text-tertiary); line-height: 1.5; }

  /* ========== DETAIL VIEW ========== */
  .detail-view { display: none; flex-direction: column; height: 100%; overflow: hidden; background: var(--bg-primary); }
  .detail-view.active { display: flex; }
  .detail-header {
    display: flex; align-items: center; padding: 16px 20px; gap: 12px;
    flex-shrink: 0; background: var(--bg-elevated); border-bottom: 1px solid var(--border-default);
  }
  .detail-back {
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: var(--bg-secondary); cursor: pointer; font-size: 18px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .detail-header-title { font-size: 17px; font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .detail-body { flex: 1; overflow-y: auto; padding: 20px; }
  .detail-match-banner {
    display: flex; align-items: center; gap: 12px; padding: 16px;
    background: var(--accent-subtle); border-radius: var(--radius-lg); margin-bottom: 20px;
  }
  .detail-match-percent { font-size: 32px; font-weight: 800; color: var(--accent-primary); }
  .detail-match-text { font-size: 13px; color: var(--accent-primary); font-weight: 600; line-height: 1.4; }
  .detail-section { margin-bottom: 20px; }
  .detail-section-title { font-size: 13px; font-weight: 700; color: var(--text-tertiary); margin-bottom: 10px; letter-spacing: 0.5px; }
  .detail-section-body { font-size: 14px; color: var(--text-secondary); line-height: 1.7; }
  .detail-section-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .detail-section-tag { padding: 6px 12px; background: var(--accent-subtle); color: var(--accent-primary); border-radius: var(--radius-full); font-size: 13px; font-weight: 600; }
  .detail-booth-info { display: flex; align-items: center; gap: 8px; padding: 14px; background: var(--bg-secondary); border-radius: var(--radius-md); font-size: 14px; font-weight: 600; }
  .detail-actions {
    display: flex; gap: 10px; padding: 16px 20px; flex-shrink: 0;
    border-top: 1px solid var(--border-default); background: var(--bg-elevated);
  }
  .detail-btn {
    flex: 1; padding: 14px; border-radius: var(--radius-md); font-size: 15px;
    font-weight: 700; cursor: pointer; font-family: var(--font-stack); border: none;
  }
  .detail-btn.primary { background: var(--accent-primary); color: white; }
  .detail-btn.secondary { background: var(--bg-secondary); color: var(--text-primary); }

  /* ========== MEETING MODAL (MT-001) ========== */
  .meeting-overlay {
    display: none; position: absolute; inset: 0;
    background: rgba(0,0,0,0.4); z-index: 100;
    align-items: flex-end; justify-content: center;
  }
  .meeting-overlay.active { display: flex; }
  .meeting-sheet {
    width: 100%; max-height: 85%; background: var(--bg-elevated);
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .meeting-handle {
    width: 40px; height: 4px; background: var(--border-default);
    border-radius: 2px; margin: 12px auto 0; flex-shrink: 0;
  }
  .meeting-header {
    display: flex; align-items: center; padding: 16px 20px 12px; gap: 12px; flex-shrink: 0;
  }
  .meeting-header-title { font-size: 17px; font-weight: 700; }
  .meeting-header-close {
    margin-left: auto; width: 32px; height: 32px; border-radius: 50%;
    border: none; background: var(--bg-secondary); cursor: pointer;
    font-size: 16px; display: flex; align-items: center; justify-content: center;
  }
  .meeting-body { flex: 1; overflow-y: auto; padding: 0 20px 20px; }
  .meeting-company-card {
    display: flex; align-items: center; gap: 14px; padding: 16px;
    background: var(--accent-subtle); border-radius: var(--radius-lg); margin-bottom: 24px;
  }
  .meeting-company-logo {
    width: 44px; height: 44px; background: var(--accent-primary); color: white;
    border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 800; flex-shrink: 0;
  }
  .meeting-company-name { font-size: 15px; font-weight: 700; }
  .meeting-company-sub { font-size: 12px; color: var(--accent-primary); margin-top: 2px; }
  .meeting-section-title {
    font-size: 15px; font-weight: 700; margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .step-num {
    width: 24px; height: 24px; border-radius: 50%; background: var(--accent-primary);
    color: white; font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .meeting-venue-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .meeting-venue {
    display: flex; align-items: center; gap: 14px; padding: 16px;
    border: 1.5px solid var(--border-default); border-radius: var(--radius-lg);
    cursor: pointer; transition: all 0.15s; background: var(--bg-elevated);
  }
  .meeting-venue:hover { border-color: var(--accent-primary); }
  .meeting-venue.selected { border-color: var(--accent-primary); background: var(--accent-subtle); }
  .meeting-venue-icon { font-size: 28px; }
  .meeting-venue-icon-text {
    width: 44px; height: 44px; border-radius: var(--radius-md);
    background: var(--bg-secondary); color: var(--text-tertiary);
    font-size: 12px; font-weight: 700; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .meeting-venue-text { flex: 1; }
  .meeting-venue-name { font-size: 15px; font-weight: 600; }
  .meeting-venue-desc { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }
  .meeting-venue-check {

// ==========================================
// CARD STACK (Variant A/C)
// ==========================================
function updateCardStack() {
  const stack = document.getElementById('card-stack');
  if (!stack) return;

  if (cardIndex >= COMPANIES.length) {
    stack.innerHTML = '';
    const complete = document.getElementById('swipe-complete');
    if (complete) { complete.classList.add('active'); document.getElementById('stat-bookmarks').textContent = bookmarks.length; document.getElementById('stat-meetings').textContent = meetingRequests; }
    const hint = document.getElementById('swipe-hint');
    if (hint) hint.style.display = 'none';
    const counter = document.getElementById('card-counter');
    if (counter) counter.style.display = 'none';
    return;
  }

  let html = '';
  for (let i = Math.min(cardIndex+2, COMPANIES.length-1); i >= cardIndex; i--) {
    const c = COMPANIES[i];
    const pos = i - cardIndex;
    const cls = pos === 0 ? '' : pos === 1 ? 'behind' : 'far-behind';
    html += `<div class="swipe-card v-${currentVariant} ${cls}" id="card-${i}" data-index="${i}" style="z-index:${10-pos}">
      <div class="swipe-overlay left">관심없음 ✕</div>
      <div class="swipe-overlay right">관심있음 ★</div>
      ${buildCardContent(c)}
    </div>`;
  }
  stack.innerHTML = html;

  const counter = document.getElementById('card-counter');
  if (counter) counter.textContent = `${cardIndex+1} / ${COMPANIES.length}`;
  updateBookmarkOuter();

  const topCard = document.getElementById('card-'+cardIndex);
  if (topCard) bindDrag(topCard);
}

let _dragCleanup = null;
function bindDrag(el) {
  if (_dragCleanup) _dragCleanup();
  let startX, startY, dx, dy, dragging = false, moved = false;

  function onStart(e) {
    if (e.target.closest('.card-actions') || e.target.closest('.card-bookmark-btn')) return;
    const ev = e.touches ? e.touches[0] : e;
    startX = ev.clientX; startY = ev.clientY; dx = 0; dy = 0;
    dragging = true; moved = false; el.style.transition = 'none';
  }
  function onMove(e) {
    if (!dragging) return;
    const ev = e.touches ? e.touches[0] : e;
    dx = ev.clientX - startX; dy = ev.clientY - startY;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) moved = true;
    el.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx*0.06}deg)`;
    const ovL = el.querySelector('.swipe-overlay.left');
    if (ovL) ovL.style.opacity = Math.min(1, Math.max(0, -dx/80));
    const ovR = el.querySelector('.swipe-overlay.right');
    if (ovR) ovR.style.opacity = Math.min(1, Math.max(0, dx/80));
  }
  function cleanup() {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('mouseup', onEnd);
    document.removeEventListener('touchend', onEnd);
    _dragCleanup = null;
  }
  _dragCleanup = cleanup;
  function onEnd() {
    if (!dragging) return;
    dragging = false;
    if (dx < -80) {
      cleanup();
      animateOut(el, -500, 0, () => { passCount++; showToast('관심없음 처리됨'); cardIndex++; updateCardStack(); });
      return;
    }
    if (dx > 80) {
      cleanup();
      const c = COMPANIES[cardIndex];
      if (c && !bookmarks.includes(c.id)) bookmarks.push(c.id);
      animateOut(el, 500, 0, () => { if (c) showToast(`${c.name} 관심기업 등록`); cardIndex++; updateCardStack(); });
      return;
    }
    el.style.transition = 'transform 0.3s ease';
    el.style.transform = 'translate(0,0) rotate(0deg)';
    const ovL = el.querySelector('.swipe-overlay.left');
    if (ovL) ovL.style.opacity = 0;
    const ovR = el.querySelector('.swipe-overlay.right');
    if (ovR) ovR.style.opacity = 0;
  }
  el.addEventListener('mousedown', onStart);
  el.addEventListener('touchstart', onStart, {passive:true});
  document.addEventListener('mousemove', onMove);
  document.addEventListener('touchmove', onMove, {passive:true});
  document.addEventListener('mouseup', onEnd);
  document.addEventListener('touchend', onEnd);
}

function animateOut(el, x, y, cb) {
  el.style.transition = 'transform 0.4s ease, opacity 0.4s ease';
  el.style.transform = `translate(${x}px,${y}px) rotate(${x*0.05}deg)`;
  el.style.opacity = '0';
  setTimeout(cb, 350);
}

}

// BOOKMARK
// ==========================================
function toggleBookmarkCurrent() {
  if (cardIndex >= COMPANIES.length) return;
  const c = COMPANIES[cardIndex];
  if (!bookmarks.includes(c.id)) {
    bookmarks.push(c.id);
    showToast(`${c.name} 관심기업 등록`);
    const el = document.getElementById('card-'+cardIndex);
    if (el) animateOut(el, 500, 0, () => { cardIndex++; updateCardStack(); });
    else { cardIndex++; updateCardStack(); }
  }
}

function updateBookmarkOuter() {
  const btn = document.getElementById('bookmark-outer');
  if (!btn || cardIndex >= COMPANIES.length) return;
  const saved = bookmarks.includes(COMPANIES[cardIndex].id);
  btn.className = 'card-bookmark-btn-outer' + (saved ? ' saved' : '');
  btn.textContent = saved ? '★ 관심기업' : '☆ 관심기업';
}

function toggleBookmarkOnCard(id) {
  const idx = bookmarks.indexOf(id);
  if (idx >= 0) { bookmarks.splice(idx,1); showToast('관심기업 해제'); }
  else { bookmarks.push(id); showToast(`${COMPANIES.find(x=>x.id===id).name} 관심기업 등록`); }
  // Re-render bookmark button on current card
  if (currentVariant === 'b') {
    render();
  } else {
    const card = document.getElementById('card-'+cardIndex);
    if (card) {
      const btn = card.querySelector('.card-bookmark-btn');
      if (btn) { const saved = bookmarks.includes(id); btn.className = 'card-bookmark-btn'+(saved?' saved':''); btn.innerHTML = saved?'★':'☆'; }
    }
  }
}

function toggleBookmark(id) {
  const idx = bookmarks.indexOf(id);
  if (idx >= 0) { bookmarks.splice(idx,1); showToast('관심기업 해제'); }
  else { bookmarks.push(id); showToast(`${COMPANIES.find(x=>x.id===id).name} 관심기업 등록`); }
  const list = document.getElementById('company-list');
  if (list) list.innerHTML = COMPANIES.map(c => buildCompanyItem(c)).join('');
}

function toggleBookmarkFromDetail(id) {
  toggleBookmark(id);

// 미팅 신청 — 공유 컴포넌트(nabi-meeting.js) 호출. 시간→장소(서브룸)+선점 슬롯 풍부 플로.
function openMeetingPage(companyId) {
  const c = COMPANIES.find(x => x.id === companyId);
  if (!c || !window.NABI_MEETING) return;
  NABI_MEETING.open(
    { name: c.name, booth: c.booth, matchScore: c.matchScore, logo: c.logo },
    { onSubmit: function () {
        meetingRequests++;
        if (companyId === (COMPANIES[cardIndex] && COMPANIES[cardIndex].id)) cardIndex++;
        showToast(`${c.name} 미팅 신청 완료`);
        updateCardStack();
      } }
  );
}

function closeMeeting() {
  const modal = document.getElementById('meeting-modal');
  if (modal) modal.classList.remove('active');
}

function selVenue(el, venue) {
  document.querySelectorAll('.meeting-venue').forEach(v=>v.classList.remove('selected'));
  el.classList.add('selected'); mtVenue = venue;
  const slots = document.getElementById('mt-slots');
  if (slots) { slots.classList.add('active'); }
  const body = document.getElementById('meeting-body');
  if (body) setTimeout(() => body.scrollTop = body.scrollHeight, 100);
  updMtBtn();
}
function selSlot(el, time) {
  document.querySelectorAll('.meeting-slot').forEach(s=>s.classList.remove('selected'));
  el.classList.add('selected'); mtSlot = time; updMtBtn();
}
function updMtBtn() {
  const btn = document.getElementById('mt-submit');
  if (!btn) return;
  if (mtVenue && mtSlot) { btn.disabled = false; btn.textContent = '미팅 신청하기'; }
  else if (mtVenue) { btn.disabled = true; btn.textContent = '시간을 선택해주세요'; }
  else { btn.disabled = true; btn.textContent = '장소와 시간을 선택해주세요'; }
}
function submitMeeting() {
  meetingRequests++;
  const c = COMPANIES.find(x=>x.id===pendingMeetingId);
  if (pendingMeetingId === COMPANIES[cardIndex]?.id) cardIndex++;
  showToast(`${c.name} 미팅 신청 완료`);
  closeMeeting();
  updateCardStack();
}

function setPreview(mode) {
  document.body.classList.toggle('preview-mobile', mode === 'mobile');
  document.querySelectorAll('.view-toggle-btn').forEach(b => b.classList.toggle('active', b.textContent.trim().toLowerCase() === mode));
}

  if (['a','b','c'].includes(pv)) currentVariant = pv;
  document.querySelectorAll('.variant-btn').forEach(b => b.classList.toggle('active', b.dataset.v === currentVariant));
})();
render();
