# Alembic 설정 — 스키마 변경의 단일 권한(Python만 DDL). docs/db/schema.sql은 여기서 파생되는 ERD.
[alembic]
script_location = migrations
prepend_sys_path = .
# sqlalchemy.url 은 비워 둔다 — migrations/env.py가 app.config.settings.database_url 에서 읽는다.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
